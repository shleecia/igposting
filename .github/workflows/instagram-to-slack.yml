name: Instagram video → Slack

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_latest:
        description: "Send the most recent video to Slack right now (for testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-to-slack
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check Instagram for new videos
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          INCLUDE_CAROUSELS: ${{ vars.INCLUDE_CAROUSELS || 'false' }}
          TEST_LATEST: ${{ inputs.test_latest || 'false' }}
        run: python3 instagram_to_slack.py

      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update Instagram state [skip ci]"
            git push
          fi
